# Installed by `scripts/deploy.sh install-unit` as
# ~/.config/systemd/user/locdoc.service.d/release.conf.
# Deploys and rollbacks swap the `current` symlink; never point this file at a
# dated release folder.
[Service]
ExecStart=
ExecStart=%h/.local/share/locdoc/releases/current/locdoc
Environment=LOCDOC_WEB=%h/.local/share/locdoc/releases/current/web
