[package]
name = "locdoc"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "limit", "trace", "compression-gzip", "compression-br"] }
yrs = { version = "=0.28.0", features = ["sync"] }
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
subtle = "2"
notify = "8"
similar = "2"
regex = "1"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
pulldown-cmark = "0.13"
percent-encoding = "2"
infer = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures-util = "0.3"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
ttf-parser = "0.25.1"
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }

[dev-dependencies]
tempfile = "3"
flate2 = "1"
brotli = "8"
rusqlite = { version = "0.38", features = ["functions"] }

[[bin]]
name = "locdoc"
path = "server/main.rs"

[profile.release]
panic = "abort"
